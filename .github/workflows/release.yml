# Release pipeline (proposal §Release & packaging): tag `v*` → Arch-container
# glibc builds for x86_64 + aarch64, Windows compile-check gate, then one
# release job merges, checksums, and publishes. Asset naming follows the
# owner convention: <name>-<tag>-<rust-target-triple>.tar.gz.
#
# Arch containers, not musl: the daily drivers are Arch systems, and the
# GPUI fork's Wayland stack links system libraries that a musl cross build
# does not provide. Template: mdrv/mdrv-oc release.yml.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            image: archlinux:base-devel
          - target: aarch64-unknown-linux-gnu
            # Native ARM64 runner, ARM64 Arch container — no cross toolchain.
            runs-on: ubuntu-24.04-arm
            image: ghcr.io/menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.image }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Install build dependencies (Wayland stack for the GPUI fork)
        run: |
          pacman -Syu --noconfirm --needed git rustup wayland libxkbcommon fontconfig freetype
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          mkdir -p "pkg/suemo" dist
          cp "target/$TARGET/release/suemo" pkg/suemo/
          cp README.md pkg/suemo/
          # Packaged systemd user unit (the repo's dist/suemo.service is the
          # dev-checkout variant; this one points at /usr/bin).
          cat > pkg/suemo/suemo.service <<'UNIT'
          [Unit]
          Description=suemo — schedule + activity daemon

          [Service]
          ExecStart=/usr/bin/suemo daemon --foreground
          Restart=on-failure

          [Install]
          WantedBy=default.target
          UNIT
          tar -czf "dist/suemo-${GITHUB_REF_NAME}-${TARGET}.tar.gz" -C pkg suemo
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.target }}
          path: dist/*

  # Windows is a compile-check target only (proposal §Platforms): the fork's
  # layer-shell patches are Wayland-only, so there is no Windows overlay to
  # ship yet. Still gating the release on it compiling.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --locked --workspace

  release:
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, windows-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
